<!DOCTYPE html>
<html>
<head>
    <title>Tugas 3 js</title>
</head>
<body>

<h2>Daftar Produk Toko</h2>

<script>

let produkToko = [
    {id: 1, nama: "Laptop", harga: 7000000, stok: 5},
    {id: 2, nama: "Mouse", harga: 200000, stok: 10},
    {id: 3, nama: "Keyboard", harga: 350000, stok: 7}
];

// Fungsi untuk menambahkan produk baru
function tambahProduk(nama, harga, stok){
    let idBaru = produkToko.length + 1;

    produkToko.push({
        id: idBaru,
        nama: nama,
        harga: harga,
        stok: stok
    });
}

// Fungsi untuk menghapus produk berdasarkan id
function hapusProduk(id){
    produkToko = produkToko.filter(function(produk){
        return produk.id !== id;
    });
}

// Fungsi untuk menampilkan daftar produk
function tampilkanProduk(){
    document.write("<table border='1' cellpadding='8'>");

    document.write("<tr>");
    document.write("<th>ID</th>");
    document.write("<th>Nama Produk</th>");
    document.write("<th>Harga</th>");
    document.write("<th>Stok</th>");
    document.write("</tr>");

    for(let i = 0; i < produkToko.length; i++){
        document.write("<tr>");
        document.write("<td>" + produkToko[i].id + "</td>");
        document.write("<td>" + produkToko[i].nama + "</td>");
        document.write("<td>Rp " + produkToko[i].harga.toLocaleString("id-ID") + "</td>");
        document.write("<td>" + produkToko[i].stok + "</td>");
        document.write("</tr>");
    }

    document.write("</table>");
}

// Menambahkan produk baru
tambahProduk("Headset", 500000, 8);

// Menghapus produk dengan id 2
hapusProduk(2);

// Menampilkan produk
tampilkanProduk();

</script>

</body>
</html>
