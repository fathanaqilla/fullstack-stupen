<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Navigation</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            height: 100vh;
        }

        .nav {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        a {
            text-decoration: none;
            color: #cbd5e1;
            font-weight: bold;
            font-size: 14px;
            padding: 10px 22px;
            border-radius: 10px;
            transition: .2s;
        }

        a:hover {
            background: #0284c7;
            color: white;
        }

        .active {
            background: #0284c7;
            color: white;
        }
    </style>
</head>

<body>

<div class="nav">
    <a href="home.html" target="mainFrame" class="active">Home</a>
    <a href="study.html" target="mainFrame">MyStudy</a>
    <a href="gallery.html" target="mainFrame">Gallery</a>
</div>

</body>
</html>
