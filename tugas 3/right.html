<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Learning Materials</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 18px;
            font-family: Arial, sans-serif;
            background: #828d98;
            color: #0f172a;
        }

        fieldset {
            border: 2px solid #0284c7;
            border-radius: 14px;
            background: white;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.06);
        }

        legend {
            background: #0284c7;
            color: white;
            padding: 7px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin: 14px 0;
        }

        a {
            color: #0369a1;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: #0284c7;
            text-decoration: underline;
        }

        small {
            color: #64748b;
        }
    </style>
</head>

<body>

<fieldset>
    <legend>Fullstack Learning</legend>

    <ul>
        <li>
            <a href="https://www.w3schools.com/html/" target="_blank">
                HTML
            </a>
            <br>
            <small>Struktur dasar website</small>
        </li>

        <li>
            <a href="https://www.w3schools.com/css/" target="_blank">
                CSS
            </a>
            <br>
            <small>Styling dan layout website</small>
        </li>

        <li>
            <a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript" target="_blank">
                JavaScript
            </a>
            <br>
            <small>Programming pada sisi web</small>
        </li>

        <li>
            <a href="https://nodejs.org/en/learn" target="_blank">
                Node.js
            </a>
            <br>
            <small>Backend JavaScript</small>
        </li>

        <li>
            <a href="https://react.dev/learn" target="_blank">
                React
            </a>
            <br>
            <small>Frontend library</small>
        </li>

        <li>
            <a href="https://dev.mysql.com/doc/" target="_blank">
                MySQL
            </a>
            <br>
            <small>Database management</small>
        </li>
    </ul>

</fieldset>

</body>
</html>
