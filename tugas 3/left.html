<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Friends</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 18px;
            font-family: Arial, sans-serif;
            background: #828d98;
            color: #0f172a;
        }

        fieldset {
            border: 2px solid #0284c7;
            border-radius: 14px;
            background: white;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.06);
        }

        legend {
            background: #0284c7;
            color: white;
            padding: 7px 13px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
        }

        ul {
            padding-left: 20px;
            margin-bottom: 0;
        }

        li {
            margin: 14px 0;
        }

        a {
            color: #0369a1;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: #0284c7;
            text-decoration: underline;
        }

        small {
            color: #64748b;
        }
    </style>
</head>

<body>

<fieldset>

</html>
