<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gallery</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page-content">

    <h2>
        <i class="bi bi-images"></i>
        My Gallery
    </h2>

    <p>
        Beberapa gambar yang berkaitan dengan teknologi,
        programming, dan desain.
    </p>


    <div class="row g-4">

        <div class="col-12 col-md-4">

            <div class="gallery-card">

                <img
                    src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=700&q=80"
                    alt="Programming"
                >

                <h5>Programming</h5>

            </div>

        </div>


        <div class="col-12 col-md-4">

            <div class="gallery-card">

                <img
                    src="https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=700&q=80"
                    alt="UI UX"
                >

                <h5>UI/UX Design</h5>

            </div>

        </div>


        <div class="col-12 col-md-4">

            <div class="gallery-card">

                <img
                    src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=700&q=80"
                    alt="Web Development"
                >

                <h5>Web Development</h5>

            </div>

        </div>

    </div>

</div>

</body>
</html>
