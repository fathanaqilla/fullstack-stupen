<!DOCTYPE html>
<html>
<head>
    <title>Tugas 2 Javascript</title>
</head>
<body>

<h2>Data Pegawai</h2>

<script>

let nama = "Dodi Prayodi";
let umur = 25;
let jabatan = "Manajer";
let status = "Menikah";

let gapok;

// Menentukan gaji pokok berdasarkan jabatan
if(jabatan == "Manajer"){
    gapok = 15000000;
}else if(jabatan == "Asisten Manajer"){
    gapok = 10000000;
}else if(jabatan == "Staff"){
    gapok = 5000000;
}

// Menghitung tunjangan jabatan 15% dari gaji pokok
let tunjanganJabatan = gapok * 15 / 100;

// Menghitung BPJS 10% dari gaji pokok
let bpjs = gapok * 10 / 100;

// Menentukan tunjangan keluarga menggunakan ternary
let tunjanganKeluarga = (status == "Menikah") ? gapok * 20 / 100 : 0;

// Menghitung total gaji
let totalGaji = gapok + tunjanganJabatan + tunjanganKeluarga - bpjs;

document.write("<table border='1' cellpadding='8' cellspacing='0'>");

document.write("<thead>");
document.write("<tr>");
document.write("<th>Nama Pegawai</th>");
document.write("<th>Umur</th>");
document.write("<th>Jabatan</th>");
document.write("<th>Status</th>");
document.write("<th>Gaji Pokok</th>");
document.write("<th>Tunjangan Jabatan</th>");
document.write("<th>BPJS</th>");
document.write("<th>Tunjangan Keluarga</th>");
document.write("<th>Total Gaji</th>");
document.write("</tr>");
document.write("</thead>");

document.write("<tbody>");
document.write("<tr>");
document.write("<td>" + nama + "</td>");
document.write("<td>" + umur + " tahun</td>");
document.write("<td>" + jabatan + "</td>");
document.write("<td>" + status + "</td>");
document.write("<td>Rp " + gapok.toLocaleString("id-ID") + "</td>");
document.write("<td>Rp " + tunjanganJabatan.toLocaleString("id-ID") + "</td>");
document.write("<td>Rp " + bpjs.toLocaleString("id-ID") + "</td>");
document.write("<td>Rp " + tunjanganKeluarga.toLocaleString("id-ID") + "</td>");
document.write("</tr>");
document.write("</tbody>");

document.write("<tfoot>");
document.write("<tr>");
document.write("<th colspan='8'>Total Gaji</th>");
document.write("<th>Rp " + totalGaji.toLocaleString("id-ID") + "</th>");
document.write("</tr>");
document.write("</tfoot>");

document.write("</table>");

</script>

</body>
</html>
